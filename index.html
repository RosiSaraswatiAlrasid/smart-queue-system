<!DOCTYPE html>
<html>
<head>
  <title>Smart Queue Monitor</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --cream:   #fdf6ee;
      --warm:    #f5e6d3;
      --tan:     #e8c9a0;
      --caramel: #c8924a;
      --brown:   #8b5e3c;
      --espresso:#3e2012;
      --text:    #2c1a0e;
      --muted:   #9e7b5a;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, #e8c9a055 0%, transparent 70%);
      top: -150px; right: -150px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, #c8924a22 0%, transparent 70%);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    .header {
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .header-eyebrow {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--caramel);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 900;
      color: var(--espresso);
      line-height: 1.1;
    }
    .header-title span { color: var(--caramel); }
    .header-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--tan);
      font-size: 18px;
      position: relative;
      z-index: 1;
    }
    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--tan), transparent);
      max-width: 80px;
    }

    .card {
      background: var(--espresso);
      border-radius: 32px;
      padding: 48px 64px;
      text-align: center;
      position: relative;
      z-index: 1;
      width: 420px;
      box-shadow:
        0 20px 60px rgba(62,32,18,0.25),
        0 4px 16px rgba(62,32,18,0.15),
        inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg, transparent, transparent 20px,
        rgba(255,255,255,0.012) 20px,
        rgba(255,255,255,0.012) 40px
      );
    }
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--caramel), var(--tan), var(--caramel), transparent);
      border-radius: 0 0 4px 4px;
    }

    .now-serving {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(253,246,238,0.45);
      font-weight: 300;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .queue {
      font-family: 'Playfair Display', serif;
      font-size: 110px;
      font-weight: 900;
      color: var(--cream);
      line-height: 1;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 60px rgba(200,146,74,0.5), 0 2px 4px rgba(0,0,0,0.3);
    }

    .queue-sub {
      font-size: 12px;
      color: rgba(253,246,238,0.35);
      margin-top: 16px;
      letter-spacing: 0.1em;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }
    .card-divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
      position: relative;
      z-index: 1;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(200,146,74,0.15);
      border: 1px solid rgba(200,146,74,0.3);
      color: var(--caramel);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 100px;
      position: relative;
      z-index: 1;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: var(--caramel);
      border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity:1; } 50% { opacity:0.2; }
    }

    .footer {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
      font-weight: 300;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-eyebrow">Universitas — Layanan Akademik</div>
    <div class="header-title">Smart <span>Queue</span> System</div>
    <div class="header-sub">Sistem Antrian Digital Terpadu</div>
  </div>

  <div class="ornament">✦</div>

  <div class="card">
    <div class="now-serving">Sedang Dipanggil</div>
    <div class="queue" id="queue">A000</div>
    <div class="queue-sub">Harap segera menuju loket yang tertera</div>
    <div class="card-divider"></div>
    <div class="live-badge">
      <span class="live-dot"></span>
      Live Update
    </div>
  </div>

  <div class="footer">© 2025 Smart Queue System — Layanan Akademik</div>

<script>

const firebaseConfig = {
  databaseURL: "https://smart-queue-system-2b6bc-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

db.ref("queue/current").on("value", (snapshot)=>{
  document.getElementById("queue").innerHTML = snapshot.val();
});

</script>

</body>
</html>
